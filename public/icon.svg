<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1b"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Top Display Screen Indicator -->
  <rect x="72" y="72" width="368" height="110" rx="28" fill="#040813" stroke="#1e293b" stroke-width="3"/>
  <text x="408" y="145" font-family="JetBrains Mono, monospace" font-size="44" font-weight="700" fill="#00f0ff" text-anchor="end" filter="url(#glow)">137.50</text>
  <text x="96" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#64748b">PORAN SMART CALC</text>

  <!-- Keypad Matrix Grid Mockup -->
  <!-- Row 1 -->
  <rect x="72" y="214" width="76" height="64" rx="18" fill="#1e293b" />
  <text x="110" y="254" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#f87171" text-anchor="middle">AC</text>

  <rect x="169" y="214" width="76" height="64" rx="18" fill="#1e293b" />
  <text x="207" y="254" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="middle">±</text>

  <rect x="266" y="214" width="76" height="64" rx="18" fill="#1e293b" />
  <text x="304" y="254" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="middle">%</text>

  <rect x="364" y="214" width="76" height="64" rx="18" fill="url(#cyanGrad)" filter="url(#glow)" />
  <text x="402" y="254" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#02121f" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="72" y="296" width="76" height="64" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="110" y="336" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">7</text>

  <rect x="169" y="296" width="76" height="64" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="207" y="336" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">8</text>

  <rect x="266" y="296" width="76" height="64" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="304" y="336" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">9</text>

  <rect x="364" y="296" width="76" height="64" rx="18" fill="url(#cyanGrad)" />
  <text x="402" y="336" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#02121f" text-anchor="middle">×</text>

  <!-- Row 3: Equal Accent Highlight -->
  <rect x="72" y="378" width="173" height="64" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="158" y="418" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">0</text>

  <rect x="266" y="378" width="76" height="64" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="304" y="418" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle">.</text>

  <rect x="364" y="378" width="76" height="64" rx="18" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <text x="402" y="419" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#02121f" text-anchor="middle">=</text>
</svg>
